name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Build all packages
        run: for p in core signer cli verify-sdk protocol mcp-server; do (cd packages/$p && bun run build); done
      - name: Test all packages
        run: bun run test
